name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      # 生成二进制形态夹具（CRLF/BOM/大文件）
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/prepare-fixtures.mjs
      - name: Format check
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Test (core + cli)
        run: cargo test -p logscope-core -p logscope-cli
      # GBK 夹具仅本地/Windows 需要；ubuntu 上 core 测试用内联字节，不依赖该文件
      - name: Fixture smoke (parse)
        run: cargo run -q -p logscope-cli -- parse fixtures/basic_app.log

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run build

  tauri:
    name: Tauri build check
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - name: cargo check (src-tauri)
        run: cargo check -p logscope-app
